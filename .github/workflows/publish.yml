name: Build and publish private-source release

on:
  repository_dispatch:
    types: [publish-pokebox-sync]

permissions:
  contents: write

concurrency:
  group: publish-pokebox-sync
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.client_payload.source_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate dispatch payload
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = "Neburb/gen1recompmod-pokebox-sync"
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out private source commit
        uses: actions/checkout@v4
        with:
          repository: Neburb/gen1recompmod-pokebox-sync
          ref: ${{ github.event.client_payload.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Determine public release version
        id: version
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import subprocess

          semver = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")
          tags = subprocess.run(
              ["git", "tag", "-l", "v*"], capture_output=True, text=True,
              check=True).stdout.splitlines()
          released = sorted(
              (tuple(map(int, match.groups())) for tag in tags
               if (match := semver.match(tag))),
          )
          manifest = json.loads(open("source/manifest.json", encoding="utf-8").read())
          candidate = tuple(map(int, str(manifest["version"]).split(".")))
          latest = released[-1] if released else None
          if latest is None:
              # The existing private package is 0.8.0; start the public
              # update channel at the next patch so it is newer on first install.
              major, minor, patch = candidate
              version = (major, minor, patch + 1)
          elif candidate > latest:
              version = candidate
          else:
              major, minor, patch = latest
              version = (major, minor, patch + 1)
              if version[2] > 99:
                  version = (major, minor + 1, 0)
          text = "%d.%d.%d" % version
          print(f"version={text}")
          print(f"tag=v{text}")
          print(f"source_sha={__import__('os').environ['SOURCE_SHA']}")
          PY

      - name: Build installable public ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/pokebox-sync-package"
          mkdir -p "$staging" dist
          git -C source archive "$SOURCE_SHA" | tar -x -C "$staging"
          rm -rf "$staging/.github" "$staging/.git" "$staging/.gitattributes" \
            "$staging/.gitignore" "$staging/.luarc.json"
          python3 - "$staging/manifest.json" "$VERSION" <<'PY'
          import json
          import sys
          path, version = sys.argv[1:]
          with open(path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          manifest["version"] = version
          manifest["github"] = "Neburb/pokebox-sync-gen1recomp"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY
          zip_path="dist/pokebox_sync-${VERSION}.zip"
          (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/$zip_path" .)
          unzip -p "$zip_path" manifest.json > "$RUNNER_TEMP/packed-manifest.json"
          python3 - "$RUNNER_TEMP/packed-manifest.json" "$VERSION" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              manifest = json.load(fh)
          if manifest.get("version") != sys.argv[2]:
              raise SystemExit("packed manifest version mismatch")
          if manifest.get("github") != "Neburb/pokebox-sync-gen1recomp":
              raise SystemExit("packed manifest github origin mismatch")
          PY
          (cd dist && sha256sum "pokebox_sync-${VERSION}.zip" > sha256sums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          # Create the release as a draft first. Creating and publishing in
          # one gh command can let GitHub cache the public release metadata
          # before the subsequent asset uploads are visible in it.
          release_id=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f "tag_name=${TAG}" \
            -f target_commitish=main \
            -f "name=PokéBox Sync ${VERSION}" \
            -f "body=Automated package for private source commit ${SOURCE_SHA}.\n\nSource: https://github.com/Neburb/gen1recompmod-pokebox-sync/commit/${SOURCE_SHA}" \
            -F draft=true -F prerelease=false \
            --jq '.id')

          gh release upload "$TAG" \
            "dist/pokebox_sync-${VERSION}.zip" \
            dist/sha256sums.txt

          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --paginate \
            --jq '.[] | select(.state == "uploaded") | .name' | sort)
          if ! grep -Fxq "pokebox_sync-${VERSION}.zip" <<<"$assets" \
              || ! grep -Fxq "sha256sums.txt" <<<"$assets"; then
            echo "Draft release ${TAG} is missing one or more install assets." >&2
            exit 1
          fi

          # Publish only after the authoritative asset endpoint is complete.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false >/dev/null

          # Confirm the public release-list representation eventually includes
          # the assets too; this catches the exact updater-visible failure.
          for attempt in $(seq 1 30); do
            visible=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.assets[].name')
            if grep -Fxq "pokebox_sync-${VERSION}.zip" <<<"$visible" \
                && grep -Fxq "sha256sums.txt" <<<"$visible"; then
              echo "Release ${TAG} is publicly visible with both install assets."
              exit 0
            fi
            echo "Waiting for published release metadata to expose assets (attempt ${attempt}/30)..."
            sleep 5
          done
          echo "Release ${TAG} was published but its public metadata does not expose both assets." >&2
          exit 1
